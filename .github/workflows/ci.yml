name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  selfhost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgc-dev clang

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build host + runtime + bars-self
        run: |
          make host
          make runtime
          make bars-self

      - name: Self-host test suite
        run: make self-test
        env:
          BARS_SKIP_TYPECHECK: "1"
